name: 抓取并发布到 Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:
  repository_dispatch:
    types: [next-round]
  schedule:
    # 每 10 分钟触发一次（UTC），刻意避开整点这个最拥挤的槽位。
    # 是否真的抓取由 src/schedule.js 按刷新节奏判断：
    #   交易日 07:00-16:00 -> 每 10 分钟（这一档只要触发就抓取）
    #   交易日 其他时段     -> 每 2 小时
    #   非交易日            -> 每 6 小时
    # 交易日用上证指数当日日K核对，A 股节假日自动按非交易日处理。
    # 注意：schedule 在平台繁忙时会被延后甚至整槽丢弃（2026-10-13 起实测一天只剩 3~4 次），
    # 所以增加「自链触发」：每轮结束后用 repository_dispatch 主动拉起下一轮，
    # cron 只作兜底。真正的抓取节奏仍由 src/schedule.js 控制，空转一轮只花几十秒。
    - cron: '4,14,24,34,44,54 * * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 判断本轮是否需要刷新
        id: decide
        run: |
          if [ "${{ github.event_name }}" = "push" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "非定时触发（${{ github.event_name }}），直接执行。"
            exit 0
          fi
          # schedule 与自链的 repository_dispatch 一视同仁，都交给节奏判断
          set +e
          node src/schedule.js --check
          code=$?
          set -e
          if [ "$code" = "3" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 准备配置
        run: |
          cp config.example.json config.json
          mkdir -p data
          mkdir -p out
          curl -fsSL --retry 2 https://yunqingzou-bit.github.io/cls-news-dashboard/research.json -o data/research.json || true
          curl -fsSL --retry 2 https://yunqingzou-bit.github.io/cls-news-dashboard/technical.json -o data/technical.json || true
          curl -fsSL --retry 2 https://yunqingzou-bit.github.io/cls-news-dashboard/market.json -o data/market.json || true
          # 延续历次盘前、早盘、午盘和收盘复盘；页面每轮行情发布时一并更新。
          curl -fsSL --retry 2 https://yunqingzou-bit.github.io/cls-news-dashboard/market-review.json -o out/market-review.json || true
          curl -fsSL --retry 2 https://yunqingzou-bit.github.io/cls-news-dashboard/market-review/ -o out/previous-market-review.html || true
          # 多来源市场新闻历史缓存；外部站点临时不可用时保留上一轮资讯。
          curl -fsSL --retry 2 https://yunqingzou-bit.github.io/cls-news-dashboard/market-news.json -o out/market-news.json || true
          # 新闻抓取失败时，用线上上一版行数据重新渲染当前代码生成的页面，避免数据源抖动阻断发布。
          curl -fsSL --retry 2 https://yunqingzou-bit.github.io/cls-news-dashboard/news.json -o out/previous-news.json || true
          # 明星看点的历史留档：线上已有就以线上为准（每天 20:00 重算并覆盖当天）
          curl -fsSL --retry 2 https://yunqingzou-bit.github.io/cls-news-dashboard/stars.json -o data/stars.json || true
          # 明日关注个股历史：首次上线用仓库里的种子，线上已有历史时以线上为准
          cp data/outlook-seed.json out/outlook.json 2>/dev/null || true
          curl -fsSL --retry 2 https://yunqingzou-bit.github.io/cls-news-dashboard/outlook.json -o out/outlook.new.json && mv out/outlook.new.json out/outlook.json || rm -f out/outlook.new.json
          # 新闻看板个股明细：线上已有历史就以线上为准（首轮为空则从头开始记）
          curl -fsSL --retry 2 https://yunqingzou-bit.github.io/cls-news-dashboard/stocks.json -o out/stocks.new.json && mv out/stocks.new.json out/stocks.json || rm -f out/stocks.new.json

          # 新闻筛选个股存档：线上已有历史就以线上为准（首轮为空则从头开始记）
          curl -fsSL --retry 2 https://yunqingzou-bit.github.io/cls-news-dashboard/news-archive.json -o out/news-archive.json || true
          # 深度因子缓存：继承上一次发布的资金/评级/商誉（deep-factors.js 12 小时内不重抓）
          curl -fsSL --retry 2 https://yunqingzou-bit.github.io/cls-news-dashboard/deep-factors.json -o data/deep-factors.json || true
      - name: 抓取（只跑沪深A股池，避免把个人自选股带进公开页面）
        env:
          TZ: Asia/Shanghai
        run: |
          set +e
          node src/cli.js --pool all-a --days 7 --site-links
          code=$?
          set -e
          if [ "$code" -ne 0 ]; then
            echo "WARN: 新闻源本轮抓取失败，使用线上上一版行数据，用当前代码继续渲染页面。"
            node tools/render-fallback.js
          fi

      - name: 采集深度因子（主力资金 / 机构评级与目标价 / 商誉）
        env:
          TZ: Asia/Shanghai
        run: node tools/deep-factors.js

      - name: 归档新闻筛选个股（新闻篮子逐日留档）
        env:
          TZ: Asia/Shanghai
        run: node tools/news-archive.js

      - name: 聚合多来源公开市场资讯
        env:
          TZ: Asia/Shanghai
        run: node tools/market-news.js

      - name: 采集 levistock A 股研究底座
        env:
          TZ: Asia/Shanghai
          HITHINK_FINANCE_API_KEY: ${{ secrets.HITHINK_FINANCE_API_KEY }}
        run: |
          python -m pip install --disable-pip-version-check --quiet pandas git+https://github.com/fleetinglife/levistock.git
          curl -fsSL --retry 2 https://raw.githubusercontent.com/mpquant/Ashare/master/Ashare.py -o tools/Ashare.py
          python tools/collect_research_base.py
          python tools/analyze_telegraph.py

      - name: 更新盘前及分时市场复盘
        env:
          TZ: Asia/Shanghai
        run: |
          if ! node tools/market-review.js; then
            echo "WARN: 本轮复盘生成失败，优先沿用线上上一版复盘页。"
            if [ -s out/previous-market-review.html ]; then
              mkdir -p market-review
              cp out/previous-market-review.html market-review/index.html
              cp out/previous-market-review.html out/market-review.html
            fi
          fi

      - name: Stockbee 动量爆发研究（近三个月 + T+1 ~ T+5 前瞻收益）
        env:
          TZ: Asia/Shanghai
        run: |
          mkdir -p out
          # 继承上一次发布的数据：若已覆盖最新交易日，脚本会跳过抓取、只重出页面，避免每轮都全市场重扫
          curl -fsSL --retry 2 https://yunqingzou-bit.github.io/cls-news-dashboard/stockbee.json -o out/stockbee.json || true
          node src/stockbee.js --months 3 --pool all-a --skip-if-fresh --no-cache

      - name: 组装发布目录
        run: |
          mkdir -p _site/cards _site/stockbee _site/outlook _site/stocks _site/market-review _site/ai-investment _site/research-base _site/trade-list _site/target-basket _site/news-archive
          cp research-base/ashare.html research-base/hithink.html research-base/telegraph-analyzer.html _site/research-base/
          cp -R ai-investment/. _site/ai-investment/
          cp research-base/index.html _site/research-base/index.html
          cp trade-list/index.html _site/trade-list/index.html
          cp target-basket/index.html _site/target-basket/index.html
          cp news-archive/index.html _site/news-archive/index.html
          if [ -s out/news-archive.json ]; then cp out/news-archive.json _site/news-archive.json; fi
          if [ -s out/deep-factors.json ]; then cp out/deep-factors.json _site/deep-factors.json; fi
          cp out/cls-news-latest.html _site/index.html
          cp out/cls-news-cards.html  _site/cards/index.html
          cp market-review/index.html _site/market-review/index.html
          if [ -s out/market-review.json ]; then cp out/market-review.json _site/market-review.json; fi
          if [ -s out/market-news.json ]; then cp out/market-news.json _site/market-news.json; fi
          cp out/cls-news-latest.csv  _site/news.csv
          cp out/cls-news-latest.json _site/news.json
          cp out/status.json          _site/status.json
          cp data/research.json _site/research.json
          cp data/technical.json _site/technical.json
          cp data/market.json _site/market.json
          cp data/stars.json _site/stars.json 2>/dev/null || true
          cp data/research-base.json _site/research-base.json 2>/dev/null || true
          cp data/telegraph-analysis.json _site/telegraph-analysis.json 2>/dev/null || true
          if [ -f out/outlook/index.html ]; then
            cp out/outlook/index.html _site/outlook/index.html
            cp out/outlook.json       _site/outlook.json
          else
            echo 'WARN: 本轮未生成明日关注个股明细，沿用线上上一版'
            curl -fsSL --retry 2 https://yunqingzou-bit.github.io/cls-news-dashboard/outlook/index.html -o _site/outlook/index.html || true
            curl -fsSL --retry 2 https://yunqingzou-bit.github.io/cls-news-dashboard/outlook.json -o _site/outlook.json || true
          fi
          if [ -f out/stocks/index.html ]; then
            cp out/stocks/index.html _site/stocks/index.html
            cp out/stocks.json       _site/stocks.json
          else
            echo 'WARN: 本轮未生成新闻看板个股明细，沿用线上上一版'
            curl -fsSL --retry 2 https://yunqingzou-bit.github.io/cls-news-dashboard/stocks/index.html -o _site/stocks/index.html || true
            curl -fsSL --retry 2 https://yunqingzou-bit.github.io/cls-news-dashboard/stocks.json -o _site/stocks.json || true
          fi
          if [ -f out/stockbee/index.html ]; then
            cp out/stockbee/index.html _site/stockbee/index.html
            cp out/stockbee.csv        _site/stockbee/stockbee.csv
            cp out/stockbee.json       _site/stockbee.json
            cp out/stockbee.json       _site/stockbee/stockbee.json
          else
            echo 'WARN: 本轮未生成 stockbee，沿用线上上一版，避免部署把它冲掉'
            curl -fsSL --retry 2 https://yunqingzou-bit.github.io/cls-news-dashboard/stockbee/index.html -o _site/stockbee/index.html || true
            curl -fsSL --retry 2 https://yunqingzou-bit.github.io/cls-news-dashboard/stockbee/stockbee.json -o _site/stockbee/stockbee.json || true
            curl -fsSL --retry 2 https://yunqingzou-bit.github.io/cls-news-dashboard/stockbee/stockbee.csv -o _site/stockbee/stockbee.csv || true
          fi
          TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M %Z' > _site/updated.txt
          echo '--- 明细 ---'
          wc -c _site/index.html _site/cards/index.html _site/news.csv _site/stockbee/index.html _site/outlook/index.html _site/stocks/index.html

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # 自链触发：任意一轮（push / schedule / 自链 dispatch）结束后，等待 3~5 分钟
  # 再用 repository_dispatch 拉起下一轮。GitHub 允许 GITHUB_TOKEN 触发
  # repository_dispatch 并由此创建新的 workflow run，无需额外 PAT。
  # 空转轮（gate 判定 run=false）只花几十秒；是否真抓取始终由 src/schedule.js 决定。
  # 若链条意外中断（运行被取消、API 失败），10 分钟 cron 兜底会把链条续上。
  chain:
    needs: [gate, build, deploy]
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 触发下一轮
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # gate/build/deploy 完成后随机等待 3~5 分钟，叠加上一轮构建耗时，
          # 交易日盘中实际节奏约每 10~14 分钟一轮，符合 schedule.js 的 10 分钟档。
          sleep $((180 + RANDOM % 120))
          for i in 1 2 3; do
            code=$(curl -s -o /dev/null -w '%{http_code}' -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/dispatches" \
              -d '{"event_type":"next-round","client_payload":{"from":"chain"}}')
            echo "dispatch attempt $i -> http $code"
            if [ "$code" = "204" ]; then exit 0; fi
            sleep 20
          done
          echo "WARN: 自链触发失败，等待 10 分钟 cron 兜底续链。"
          exit 0
