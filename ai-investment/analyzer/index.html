<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>资讯分析报告</title><style>body{font:14px/1.6 system-ui,"Microsoft YaHei";max-width:1100px;margin:auto;padding:20px;background:#f5f7fa;color:#18232d}main{background:#fff;padding:22px;border-radius:14px}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.card{border:1px solid #e5ebf0;border-radius:9px;padding:13px}.card b{font-size:23px}.muted{color:#687586}.bar{display:flex;gap:8px;align-items:center;margin:14px 0}button{padding:8px;border:1px solid #dce5ea;border-radius:7px;background:#fff;color:#075985;cursor:pointer}table{border-collapse:collapse;width:100%;margin-top:16px}td,th{border:1px solid #e5ebf0;padding:8px;text-align:left}@media(max-width:700px){.cards{grid-template-columns:1fr}}</style><main><a href="../">← 返回 AI 投研助手</a><h1>资讯分析报告 · cls-telegraph-analyzer</h1><p class="muted">按小时聚合你看板的财联社新闻，输出主题热度、情绪和研究提示。</p><div class="bar"><button id="run">生成/刷新报告</button><span id="time" class="muted"></span></div><div class="cards"><div class="card"><span class="muted">样本新闻</span><br><b id="n">—</b></div><div class="card"><span class="muted">偏正面</span><br><b id="p">—</b></div><div class="card"><span class="muted">偏负面</span><br><b id="m">—</b></div></div><h2>主题与时段报告</h2><table><thead><tr><th>主题/时段</th><th>新闻数</th><th>方向</th><th>研究提示</th></tr></thead><tbody id="out"><tr><td colspan="4">点击生成报告</td></tr></tbody></table></main><script>(()=>{let $=x=>document.querySelector(x),rows=[],txt=r=>JSON.stringify(r),sc=r=>{let t=txt(r),p=['增长','支持','利好','上涨','签约','获批','订单','改善'],n=['下跌','风险','减持','亏损','处罚','监管','下调','跌停','调查','取消'];return p.filter(x=>t.includes(x)).length-n.filter(x=>t.includes(x)).length};function report(){let keys=['AI','芯片','新能源','军工','医药','地产','消费','金融','机器人','算力'],all=[...keys.map(k=>[k,rows.filter(r=>txt(r).includes(k))]),...Object.entries(rows.reduce((o,r)=>{let d=new Date((Number(r.ctime)||0)*1000);let h=Number.isNaN(d.getHours())?'未知':String(d.getHours()).padStart(2,'0')+':00';(o[h]??=[]).push(r);return o},{}))];$('#n').textContent=rows.length;$('#p').textContent=rows.filter(r=>sc(r)>0).length;$('#m').textContent=rows.filter(r=>sc(r)<0).length;$('#out').innerHTML=all.filter(x=>x[1].length).sort((a,b)=>b[1].length-a[1].length).slice(0,18).map(x=>{let z=x[1].reduce((a,r)=>a+sc(r),0),d=z>0?'偏正面':z<0?'偏负面':'中性';return '<tr><td>'+x[0]+'</td><td>'+x[1].length+'</td><td>'+d+'</td><td>'+ (d==='偏正面'?'关注持续性和成交量确认。':d==='偏负面'?'关注风险扩散和价格反应。':'等待更明确催化。')+'</td></tr>'}).join('')||'<tr><td colspan="4">暂无可聚合数据</td></tr>';$('#time').textContent='生成于 '+new Date().toLocaleString('zh-CN')}function load(){fetch('../../news.json?'+Date.now()).then(r=>r.json()).then(d=>{rows=Array.isArray(d)?d:(d.rows||d.news||d.items||[]);report()}).catch(()=>$('#out').innerHTML='<tr><td colspan="4">无法读取 ../../news.json</td></tr>')}$('#run').onclick=load;load()})();</script>
