<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CLSNews事件因子</title><style>body{font:14px/1.6 system-ui,"Microsoft YaHei";max-width:1100px;margin:auto;padding:20px;background:#f5f7fa;color:#18232d}main{background:white;padding:22px;border-radius:14px}input,select,button{padding:8px;border:1px solid #dde5eb;border-radius:7px;background:#fff}button{cursor:pointer;color:#075985}.bar{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}.bar input{flex:1;min-width:220px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.box{border:1px solid #e5ebf0;border-radius:10px;padding:14px}.row{padding:10px 0;border-top:1px solid #edf0f3;cursor:pointer}.muted{color:#687586}.up{color:#c2413d}.down{color:#198754}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style><main><a href="../">← 返回 AI 投研助手</a><h1>CLSNews · 事件因子研究</h1><p class="muted">实时读取看板 news.json，生成事件方向、强度和主题线索。</p><div class="bar"><input id="q" placeholder="搜索新闻/股票/主题"><select id="lv"><option value="all">全部等级</option><option>A</option><option>B</option><option>C</option></select><button data-t="all">全部</button><button data-t="positive">偏正面</button><button data-t="negative">偏负面</button></div><div class="grid"><section class="box"><h2>事件列表 <small id="count"></small></h2><div id="list">加载中…</div></section><section class="box"><h2>结构化因子</h2><div id="detail" class="muted">点击新闻查看分析</div></section></div></main><script>(()=>{let rows=[],tone='all',q=x=>document.querySelector(x),txt=r=>[r.title,r.content,r.text,r.stockName,r.stockCode].filter(Boolean).join(' '),sc=r=>{let t=txt(r),p=['增长','支持','利好','上涨','突破','签约','获批','订单','回购','改善'],n=['下跌','风险','减持','亏损','处罚','监管','下调','跌停','调查','取消','暂停'];return p.filter(x=>t.includes(x)).length-n.filter(x=>t.includes(x)).length},kind=r=>sc(r)>0?'positive':sc(r)<0?'negative':'neutral',esc=x=>String(x??'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])),title=r=>r.title||r.content||r.text||'未命名新闻';function render(){let s=q('#q').value.toLowerCase(),l=q('#lv').value,rs=rows.filter(r=>(l==='all'||String(r.level||'').toUpperCase()===l)&&(!s||txt(r).toLowerCase().includes(s))&&(tone==='all'||kind(r)===tone));q('#count').textContent='('+rs.length+')';q('#list').innerHTML=rs.slice(0,150).map(r=>`<div class="row" data-i="${rows.indexOf(r)}"><b>${esc(title(r))}</b><div class="muted">${esc(r.level||'')} · ${esc(r.time||r.publishTime||r.ctime||'')} · ${kind(r)}</div></div>`).join('')||'<p class="muted">暂无匹配数据</p>';document.querySelectorAll('.row').forEach(x=>x.onclick=()=>show(+x.dataset.i))}function show(i){let r=rows[i],s=sc(r),ks=['AI','芯片','新能源','军工','医药','地产','消费','金融','机器人','算力'].filter(x=>txt(r).includes(x)),d=s>0?'偏正面':s<0?'偏负面':'中性';q('#detail').innerHTML=`<h3>${esc(title(r))}</h3><p>事件方向：<b class="${s>0?'up':s<0?'down':''}">${d}</b></p><p>事件强度：<b>${Math.min(100,50+Math.abs(s)*12)}/100</b></p><p>影响主题：${ks.join('、')||'待识别'}</p><p>研究线索：${d==='偏正面'?'催化预期改善，需验证成交量和价格同步。':d==='偏负面'?'可能压制预期，需验证是否持续放量下跌。':'暂未识别明确方向。'}</p><p class="muted">规则化摘要，不替代原文核验和回测。</p>`}fetch('../../news.json?'+Date.now()).then(r=>r.json()).then(d=>{rows=Array.isArray(d)?d:(d.rows||d.news||d.items||[]);render()}).catch(()=>q('#list').textContent='无法读取 ../../news.json');q('#q').oninput=render;q('#lv').onchange=render;document.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{tone=b.dataset.t;render()})})();</script>
