<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CLSNews · 事件因子研究</title><style>body{font:15px/1.7 system-ui,"Microsoft YaHei";max-width:900px;margin:40px auto;padding:0 18px;background:#f6f8fb;color:#18232d}main{background:#fff;padding:28px;border:1px solid #e4e9ef;border-radius:14px}h1{margin-top:0}a{color:#0e7490}li{margin:9px 0}.box{background:#f1f8fa;padding:14px;border-radius:9px;margin:18px 0}</style><main><a href="../">← 返回 AI 投研助手</a><h1>CLSNews · 新闻事件因子研究</h1><p>将财联社电报转成可用于研究的结构化金融事件。</p><div class="box"><b>研究链路</b><p>原始电报 → LLM 叙事提取 → 情绪/强度/因果链 → 影响标的 → 事件收益验证</p></div><h2>核心字段</h2><ul><li>基础事实：发布时间、来源、新闻类型、主要主体</li><li>叙事核心：核心故事、参与者、行为和场景</li><li>量化映射：情绪分数、叙事强度、风险收益、影响标的</li><li>研究用途：构建新闻情绪因子、政策因子和事件驱动观察池</li></ul><p><a href="https://github.com/chaofanat/CLSNews" target="_blank">查看原项目 GitHub ↗</a></p></main>
