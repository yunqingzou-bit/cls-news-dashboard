<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>统一数据底座 · 财联社</title><style>body{font:15px/1.7 system-ui,"Microsoft YaHei";max-width:900px;margin:40px auto;padding:0 18px;background:#f6f8fb;color:#18232d}main{background:#fff;padding:28px;border:1px solid #e4e9ef;border-radius:14px}h1{margin-top:0}a{color:#0e7490}li{margin:9px 0}.box{background:#f1f8fa;padding:14px;border-radius:9px;margin:18px 0}code{background:#eef2f5;padding:2px 5px;border-radius:4px}</style><main><a href="../">← 返回 AI 投研助手</a><h1>统一数据底座 · cailianpress-unified</h1><p>统一财联社电报、加红、热度和文章详情的数据入口，为分析模块提供可靠原始数据。</p><div class="box"><b>数据链路</b><p>主接口采集 → 原始层去重 → SQLite 存储 → 主题/股票/板块关联 → 查询与审计</p></div><h2>可用于</h2><ul><li>查询普通、加红和高热度电报</li><li>按发布时间、等级和阅读量筛选</li><li>保留抓取日志，追踪数据变化</li><li>向 CLSNews 或其他 AI 分析模块提供数据</li></ul><p>建议以 <code>telegraph_raw_main</code> 作为原始主表，以发布时间、等级和热度索引支持研究查询。</p><p><a href="https://github.com/caimao9539/cailianpress-unified" target="_blank">查看原项目 GitHub ↗</a></p></main>
