<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>统一数据底座</title><style>body{font:14px/1.6 system-ui,"Microsoft YaHei";max-width:1000px;margin:auto;padding:20px;background:#f5f7fa;color:#18232d}main{background:#fff;padding:22px;border-radius:14px}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.card{border:1px solid #e5ebf0;border-radius:9px;padding:13px}.card b{font-size:24px}.muted{color:#687586}table{border-collapse:collapse;width:100%;margin-top:18px}td,th{border:1px solid #e5ebf0;padding:8px;text-align:left}@media(max-width:700px){.cards{grid-template-columns:1fr 1fr}}</style><main><a href="../">← 返回 AI 投研助手</a><h1>统一数据底座 · cailianpress-unified</h1><p class="muted">读取公开新闻数据，模拟原项目的数据入库、去重、等级和主题索引状态。</p><button id="reload">刷新数据</button><div class="cards"><div class="card"><span class="muted">原始新闻</span><br><b id="n">—</b></div><div class="card"><span class="muted">去重后新闻</span><br><b id="u">—</b></div><div class="card"><span class="muted">A/B 级新闻</span><br><b id="ab">—</b></div><div class="card"><span class="muted">主题命中</span><br><b id="topics">—</b></div></div><table><thead><tr><th>字段/索引</th><th>当前状态</th><th>用途</th></tr></thead><tbody id="table"></tbody></table></main><script>(()=>{let $=x=>document.querySelector(x),load=()=>fetch('../../news.json?'+Date.now()).then(r=>r.json()).then(d=>{let a=Array.isArray(d)?d:(d.rows||d.news||d.items||[]),keys=['AI','芯片','新能源','军工','医药','地产','消费','金融','机器人','算力'],seen=new Set(a.map(x=>x.id||x.title||x.content)),ab=a.filter(x=>['A','B'].includes(String(x.level||'').toUpperCase())).length,h=keys.filter(k=>a.some(x=>JSON.stringify(x).includes(k))).length;$('#n').textContent=a.length;$('#u').textContent=seen.size;$('#ab').textContent=ab;$('#topics').textContent=h;$('#table').innerHTML=[['telegraph_raw_main','正常','原始新闻去重主表'],['telegraph_raw_log',a.length+' 条样本','抓取批次审计'],['level 索引',ab+' 条 A/B','加红和重要新闻查询'],['主题关联',h+' 个主题','板块/行业聚合']].map(x=>'<tr><td>'+x[0]+'</td><td>'+x[1]+'</td><td>'+x[2]+'</td></tr>').join('')}).catch(()=>$('#table').innerHTML='<tr><td colspan="3">无法读取 ../../news.json</td></tr>');$('#reload').onclick=load;load()})();</script>
