<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>统一数据底座</title>
<style>
:root{font:14px/1.6 system-ui,"Microsoft YaHei",sans-serif;color:#18232d;background:#f5f7fa}*{box-sizing:border-box}body{max-width:1280px;margin:auto;padding:20px}main{background:#fff;padding:24px;border-radius:16px;box-shadow:0 8px 30px #17324d0d}h1{margin:18px 0 6px;font-size:30px}.muted{color:#687586}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.toolbar input,.toolbar select,.toolbar button{font:inherit;padding:8px 10px;border:1px solid #cbd7e2;border-radius:7px;background:#fff}.toolbar input{min-width:260px;flex:1}.toolbar button{cursor:pointer;background:#1261a0;color:#fff;border-color:#1261a0}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card{border:1px solid #e2eaf1;border-radius:10px;padding:14px}.card b{font-size:26px}.card small{display:block;color:#687586;margin-top:3px}.status{min-height:24px;color:#687586}.table-wrap{overflow:auto;border:1px solid #e2eaf1;border-radius:9px}table{border-collapse:collapse;width:100%;min-width:900px}th,td{border-bottom:1px solid #e8eef3;padding:10px;text-align:left;vertical-align:top}th{background:#f8fafc;white-space:nowrap}tr:last-child td{border-bottom:0}.time{white-space:nowrap;color:#687586}.level{display:inline-block;padding:2px 7px;border-radius:999px;background:#eef3f7}.level.a{background:#ffe4e1;color:#b42318}.level.b{background:#fff1d6;color:#9a6700}.chips{display:flex;gap:5px;flex-wrap:wrap}.chip{padding:2px 7px;border-radius:999px;background:#edf6ff;color:#1261a0;white-space:nowrap}.title{font-weight:600;color:#1261a0;text-decoration:none}.title:hover{text-decoration:underline}.content{max-width:530px;white-space:pre-wrap;color:#44515e}.empty{text-align:center;padding:38px;color:#687586}.meta{display:flex;justify-content:space-between;gap:12px;margin:8px 0}.count{font-weight:600}.more{display:block;margin:14px auto 0;padding:8px 18px;border:1px solid #cbd7e2;border-radius:7px;background:#fff;cursor:pointer}@media(max-width:760px){body{padding:10px}main{padding:16px}.cards{grid-template-columns:1fr 1fr}h1{font-size:24px}.toolbar input{min-width:180px}}
</style>
</head>
<body><main>
<a href="../">← 返回 AI 投研助手</a>
<h1>统一数据底座 · cailianpress-unified</h1>
<p class="muted">统一读取看板公开新闻数据，并提供去重统计、等级识别、主题索引和新闻明细查询。</p>
<div class="toolbar"><input id="search" placeholder="搜索标题、正文、股票或主题"><select id="level"><option value="">全部等级</option><option value="A">A 级</option><option value="B">B 级</option><option value="C">C 级</option><option value="unknown">未标等级</option></select><select id="topic"><option value="">全部主题</option></select><button id="reload">刷新数据</button></div>
<div id="status" class="status">正在读取新闻数据…</div>
<div class="cards"><div class="card"><span class="muted">原始新闻</span><br><b id="n">—</b><small>当前 news.json 记录数</small></div><div class="card"><span class="muted">去重后新闻</span><br><b id="u">—</b><small>按链接/标题/正文去重</small></div><div class="card"><span class="muted">A/B 级新闻</span><br><b id="ab">—</b><small id="abNote">按数据中的等级字段统计</small></div><div class="card"><span class="muted">主题命中</span><br><b id="topics">—</b><small>自动识别的主题数量</small></div></div>
<div class="meta"><span class="count" id="resultCount">新闻明细</span><span class="muted" id="updated"></span></div>
<div class="table-wrap"><table><thead><tr><th>时间</th><th>等级</th><th>主题/板块</th><th>股票</th><th>新闻内容</th><th>来源</th></tr></thead><tbody id="news"><tr><td colspan="6" class="empty">正在加载…</td></tr></tbody></table></div><button id="more" class="more" hidden>加载更多</button>
<hr><h3>数据索引状态</h3><div class="table-wrap"><table><thead><tr><th>字段/索引</th><th>当前状态</th><th>用途</th></tr></thead><tbody id="index"><tr><td colspan="3" class="empty">—</td></tr></tbody></table></div>
</main>
<script>
(()=>{const $=id=>document.getElementById(id);let all=[],filtered=[],shown=0;const pageSize=50;const topics=['AI','芯片','新能源','军工','医药','地产','消费','金融','机器人','算力','低空经济','半导体','汽车','电力','有色','传媒','通信'];
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const val=(x,ks)=>{for(const k of ks){if(x&&x[k]!==undefined&&x[k]!==null&&String(x[k]).trim())return x[k]}return ''};
const text=x=>String(val(x,['content','text','summary','description','title','headline'])||'');
const title=x=>String(val(x,['title','headline','name'])||text(x).slice(0,80)||'未命名新闻');
const level=x=>String(val(x,['level','importance','grade','news_level'])||'').toUpperCase().replace('等级','');
const time=x=>String(val(x,['time','publish_time','published_at','date','created_at','datetime'])||'—');
const link=x=>String(val(x,['url','link','article_url','source_url'])||'');
const stock=x=>val(x,['stock','stocks','stockName','stock_name','stockCode','stock_code','related_stocks']);
const topicsOf=x=>{let raw=val(x,['topic','topics','prefix','category','tags','sector','industry']);let s=Array.isArray(raw)?raw.join(' '):String(raw||'');return topics.filter(t=>(s+' '+title(x)+' '+text(x)).includes(t))};
const flat=d=>Array.isArray(d)?d:(d&&Array.isArray(d.rows)?d.rows:(d&&Array.isArray(d.news)?d.news:(d&&Array.isArray(d.items)?d.items:[])));
function dedup(a){const seen=new Set();return a.filter(x=>{const k=String(val(x,['id','url','link','title','content','text'])||JSON.stringify(x));if(seen.has(k))return false;seen.add(k);return true})}
function render(){const q=$('search').value.trim().toLowerCase(),lv=$('level').value,tp=$('topic').value;filtered=all.filter(x=>{const hay=(title(x)+' '+text(x)+' '+JSON.stringify(stock(x))+' '+topicsOf(x).join(' ')).toLowerCase();const l=level(x);return(!q||hay.includes(q))&&(!lv||(lv==='unknown'?!l:l===lv))&&(!tp||topicsOf(x).includes(tp))});shown=0;draw();$('resultCount').textContent=`新闻明细：${filtered.length} 条（已显示 ${Math.min(pageSize,filtered.length)} 条）`}
function draw(){const rows=filtered.slice(shown,shown+pageSize);shown+=rows.length;$('news').innerHTML=shown?rows.map(x=>{const l=level(x),ts=topicsOf(x),st=stock(x),u=link(x);return `<tr><td class="time">${esc(time(x))}</td><td><span class="level ${l==='A'?'a':l==='B'?'b':''}">${esc(l||'未标')}</span></td><td><div class="chips">${(ts.length?ts:['未识别']).map(t=>`<span class="chip">${esc(t)}</span>`).join('')}</div></td><td>${esc(Array.isArray(st)?st.join('、'):st||'—')}</td><td><div>${u?`<a class="title" href="${esc(u)}" target="_blank" rel="noopener">${esc(title(x))}</a>`:esc(title(x))}</div><div class="content">${esc(text(x).slice(0,260))}</div></td><td>${u?`<a href="${esc(u)}" target="_blank" rel="noopener">打开来源</a>`:'—'}</td></tr>`}).join(''):'<tr><td colspan="6" class="empty">没有匹配的新闻。请清除筛选条件或点击“刷新数据”。</td></tr>';$('more').hidden=shown>=filtered.length;$('resultCount').textContent=`新闻明细：${filtered.length} 条（已显示 ${Math.min(shown,filtered.length)} 条）`}
function load(){ $('status').textContent='正在读取新闻数据…';fetch('../../news.json?'+Date.now()).then(r=>{if(!r.ok)throw Error('HTTP '+r.status);return r.json()}).then(d=>{all=dedup(flat(d));const explicit=all.filter(x=>['A','B'].includes(level(x))).length;const ts=new Set(all.flatMap(topicsOf));$('n').textContent=flat(d).length;$('u').textContent=all.length;$('ab').textContent=explicit;$('topics').textContent=ts.size;$('abNote').textContent=explicit?'按数据中的等级字段统计':'当前数据未提供 A/B 等级字段';$('updated').textContent='更新：'+new Date().toLocaleString('zh-CN');$('status').textContent='数据读取成功，可搜索和筛选新闻。';$('index').innerHTML=[['telegraph_raw_main','正常 · '+all.length+' 条','原始新闻去重主表'],['telegraph_raw_log',flat(d).length+' 条样本','抓取批次审计'],['level 索引',explicit+' 条 A/B','重要新闻查询；未提供等级时不擅自推断'],['主题关联',ts.size+' 个主题','板块/行业聚合与检索']].map(x=>`<tr><td>${esc(x[0])}</td><td>${esc(x[1])}</td><td>${esc(x[2])}</td></tr>`).join('');$('topic').innerHTML='<option value="">全部主题</option>'+[...ts].sort().map(t=>`<option>${esc(t)}</option>`).join('');render()}).catch(e=>{$('status').textContent='数据读取失败：'+e.message;$('news').innerHTML='<tr><td colspan="6" class="empty">无法读取 ../../news.json，请确认数据采集任务已成功运行。</td></tr>'})}
$('search').oninput=render;$('level').onchange=render;$('topic').onchange=render;$('more').onclick=draw;$('reload').onclick=load;load()})();
</script></body></html>
