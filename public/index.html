<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="manifest" href="./manifest.webmanifest">
<meta name="theme-color" content="#0e7490">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="财联社精选20">
<link rel="apple-touch-icon" href="./icon-192.png">
<title>财联社新闻精选20</title>
<style>
:root{--ink:#102a43;--muted:#6b7c93;--line:#d9e2ec;--bg:#f4f7fa;--surface:#fff;--cyan:#0e7490;--cyan-soft:#e6f6f8;--green:#087f5b;--green-soft:#e6fcf5;--amber:#b45309;--amber-soft:#fff7ed;--red:#b42318;--red-soft:#fff1f0;--shadow:0 12px 30px rgba(16,42,67,.07)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.65 "Microsoft YaHei",system-ui,-apple-system,"Segoe UI",sans-serif}a{color:inherit;text-decoration:none}button,input,select{font:inherit}.shell{max-width:1180px;margin:auto;padding:26px 22px 48px}.topbar{display:flex;justify-content:space-between;align-items:flex-start;gap:20px}.brand{font-size:13px;letter-spacing:.12em;color:var(--cyan);font-weight:700}.title{font-size:30px;line-height:1.2;margin:8px 0 4px;letter-spacing:-.03em}.lede{color:var(--muted);margin:0}.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}.btn{padding:8px 13px;border-radius:8px;background:var(--surface);border:1px solid var(--line);color:var(--ink)}.btn.primary{background:var(--cyan);border-color:var(--cyan);color:#fff}.btn:disabled{opacity:.55;cursor:wait}.status{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:12px;margin-top:18px}.dot{width:8px;height:8px;border-radius:50%;background:#94a3b8}.dot.live{background:var(--green)}.dot.busy{background:#f59e0b;animation:pulse 1s infinite}.dot.error{background:var(--red)}@keyframes pulse{50%{opacity:.35}}
.overview{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:12px;margin:25px 0 18px}.overview-card{background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:17px 18px;box-shadow:var(--shadow)}.overview-card h2{font-size:12px;letter-spacing:.08em;color:var(--muted);margin:0 0 5px}.overview-card p{margin:0;font-size:16px;font-weight:700}.overview-card small{display:block;color:var(--muted);font-weight:400;margin-top:2px}.accent{background:linear-gradient(135deg,#0e7490,#155e75);color:#fff;border-color:#0e7490}.accent h2,.accent small{color:#c9f3f5}.filters{display:flex;gap:9px;align-items:center;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:12px;margin-bottom:16px}.filters input,.filters select{min-height:38px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);padding:7px 10px}.filters input{flex:1 1 270px}.filters select{flex:0 1 180px}.count{color:var(--muted);font-size:12px;margin-left:auto;white-space:nowrap}.list{display:grid;gap:12px}.item{background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:17px 18px;box-shadow:var(--shadow);transition:transform .18s ease,box-shadow .18s ease}.item:hover{transform:translateY(-2px);box-shadow:0 16px 36px rgba(16,42,67,.11)}.item-head{display:flex;gap:12px;align-items:flex-start}.rank{flex:none;width:32px;height:32px;border-radius:9px;background:var(--cyan-soft);color:var(--cyan);display:grid;place-items:center;font-size:15px;font-weight:800}.item-main{min-width:0;flex:1}.meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;color:var(--muted);font-size:12px;margin-bottom:3px}.topic{color:var(--cyan);font-weight:700}.prefix{padding:2px 7px;border-radius:5px;background:#f1f5f9;color:#486581}.item-title{font-size:17px;line-height:1.45;font-weight:750;margin:0}.item-title a:hover{color:var(--cyan)}.impact{flex:none;padding:4px 9px;border-radius:7px;font-size:12px;font-weight:700}.impact.good{color:var(--green);background:var(--green-soft)}.impact.warn{color:var(--amber);background:var(--amber-soft)}.impact.mix{color:#52606d;background:#f1f5f9}.summary{color:#486581;margin:11px 0 10px;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3;overflow:hidden}.stocks{display:flex;gap:6px;flex-wrap:wrap}.stock{padding:3px 8px;border:1px solid #d6e4ea;border-radius:999px;background:#f8fbfc;color:#155e75;font-size:12px}.footer{color:var(--muted);font-size:12px;margin-top:23px;display:flex;gap:12px;justify-content:space-between;flex-wrap:wrap}.footer a{color:var(--cyan)}.empty{padding:45px 20px;text-align:center;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:13px}.error-box{padding:13px 15px;background:var(--red-soft);border:1px solid #fecaca;color:var(--red);border-radius:10px;display:none;margin-bottom:14px}
@media(max-width:720px){.shell{padding:18px 13px 36px}.topbar{display:block}.actions{justify-content:flex-start;margin-top:14px}.title{font-size:26px}.overview{grid-template-columns:1fr 1fr}.overview-card:first-child{grid-column:1/-1}.filters{padding:10px}.filters input,.filters select{flex:1 1 100%;width:100%}.count{margin-left:0}.item{padding:14px}.item-head{gap:9px}.rank{width:29px;height:29px}.item-title{font-size:16px}.impact{font-size:11px;padding:3px 7px}.summary{-webkit-line-clamp:4}}
</style>
</head>
<body>
<main class="shell">
  <section class="topbar">
    <div>
      <div class="brand">CLS · MARKET SIGNALS</div>
      <h1 class="title">财联社新闻精选20</h1>
      <p class="lede">把政策、产业催化、订单与资金信号，整理成今天值得跟踪的20条。</p>
    </div>
    <div class="actions">
      <a class="btn" href="./table/">完整表格</a>
      <a class="btn" href="./news.csv">下载数据</a>
      <button class="btn primary" id="refresh">刷新看板</button>
    </div>
  </section>
  <div class="status"><span class="dot live" id="dot"></span><span id="status">正在读取最新快照…</span></div>
  <section class="overview">
    <div class="overview-card accent"><h2>今日主线</h2><p id="mainTopic">读取中…</p><small id="mainTopicSub">按新闻热度与产业传导排序</small></div>
    <div class="overview-card"><h2>精选数量</h2><p id="total">—</p><small>近3天去重后精选</small></div>
    <div class="overview-card"><h2>下一次自动检查</h2><p id="nextRefresh">60秒</p><small>页面每60秒检查一次最新发布</small></div>
  </section>
  <div class="error-box" id="error"></div>
  <section class="filters" aria-label="新闻筛选">
    <input id="q" type="search" placeholder="搜索股票、新闻或主题…" autocomplete="off">
    <select id="topic"><option value="">全部主题</option></select>
    <select id="impact"><option value="">全部影响</option><option value="偏利好">偏利好</option><option value="分化">分化</option><option value="偏谨慎">偏谨慎</option></select>
    <span class="count" id="count">—</span>
  </section>
  <section class="list" id="list"></section>
  <div class="empty" id="empty" style="display:none">没有符合条件的精选新闻</div>
  <footer class="footer"><span>数据源：财联社 cls.cn · 页面自动读取最新发布快照</span><span><a href="https://www.cls.cn/depth?id=1000" target="_blank" rel="noopener noreferrer">查看财联社深度栏目</a> · 仅供研究参考，不构成投资建议</span></footer>
</main>
<script>
(function(){
  var data={items:[],meta:{}};var timer=null;var seconds=60;
  var els={list:document.getElementById('list'),empty:document.getElementById('empty'),error:document.getElementById('error'),status:document.getElementById('status'),dot:document.getElementById('dot'),total:document.getElementById('total'),mainTopic:document.getElementById('mainTopic'),mainTopicSub:document.getElementById('mainTopicSub'),next:document.getElementById('nextRefresh'),count:document.getElementById('count'),q:document.getElementById('q'),topic:document.getElementById('topic'),impact:document.getElementById('impact'),refresh:document.getElementById('refresh')};
  function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
  function dateText(s){if(!s)return '时间未知';var raw=String(s),d=/T.*Z$/.test(raw)?new Date(raw):new Date(raw.replace(' ','T')+'+08:00');return isNaN(d.getTime())?raw:d.toLocaleString('zh-CN',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'});}
  function impactClass(d){return d==='偏利好'?'good':d==='偏谨慎'?'warn':'mix';}
  function rebuildTopics(){var seen={};data.items.forEach(function(x){if(x.topic)seen[x.topic]=1});var old=els.topic.value;els.topic.innerHTML='<option value="">全部主题</option>'+Object.keys(seen).sort().map(function(x){return '<option value="'+esc(x)+'">'+esc(x)+'</option>'}).join('');els.topic.value=old;}
  function render(){var q=els.q.value.trim().toLowerCase(),topic=els.topic.value,impact=els.impact.value;var list=data.items.filter(function(x){var text=[x.title,x.summary,x.topic,(x.stocks||[]).join(' ')].join(' ').toLowerCase();return (!q||text.indexOf(q)>-1)&&(!topic||x.topic===topic)&&(!impact||x.impactDirection===impact)});els.count.textContent='显示 '+list.length+' / '+data.items.length+' 条';els.empty.style.display=list.length?'none':'block';els.list.innerHTML=list.map(function(x){var stocks=(x.stocks||[]).slice(0,8).map(function(s){return '<span class="stock">'+esc(s)+'</span>'}).join('');var more=(x.stockCount||0)>8?'<span class="stock">+'+((x.stockCount||0)-8)+'只</span>':'';return '<article class="item"><div class="item-head"><div class="rank">'+esc(x.rank)+'</div><div class="item-main"><div class="meta"><span class="topic">'+esc(x.topic||'其他')+'</span><span class="prefix">'+esc(x.prefix||'财联社')+'</span><span>'+esc(dateText(x.time))+'</span></div><h2 class="item-title"><a href="'+esc(x.url)+'" target="_blank" rel="noopener noreferrer">'+esc(x.title)+'</a></h2></div><span class="impact '+impactClass(x.impactDirection)+'">'+esc(x.impactDirection||'分化')+' · '+esc(x.impactLevel||'观察')+'</span></div><p class="summary">'+esc(x.impactSummary||x.summary||'暂无摘要')+'</p><div class="stocks">'+stocks+more+'</div></article>'}).join('');}
  function setSummary(){els.total.textContent=data.items.length+' 条';var first=data.items[0];if(first){els.mainTopic.textContent=first.topic||'多主题';els.mainTopicSub.textContent='头条：'+(first.title||'').replace(/^【[^】]+】\s*/,'').slice(0,38)+(first.title&&first.title.length>38?'…':'')}}
  function resetTimer(){seconds=60;clearInterval(timer);timer=setInterval(function(){seconds--;if(seconds<=0)seconds=60;els.next.textContent=seconds+'秒'},1000)}
  async function load(manual){if(manual){els.refresh.disabled=true;els.refresh.textContent='读取中…';els.dot.className='dot busy'}try{var r=await fetch('./top20.json?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);data=await r.json();setSummary();rebuildTopics();render();var when=data.meta.generatedAtShanghai||data.meta.generatedAt||'';els.status.textContent='已更新 '+(when?dateText(when):'刚刚')+' · '+(data.meta.range||'近3天')+' · 每60秒自动检查';els.dot.className='dot live';els.error.style.display='none';resetTimer()}catch(e){els.dot.className='dot error';els.status.textContent='暂时无法读取最新快照';els.error.textContent='读取失败：'+e.message+'。可稍后重试，或打开完整表格查看上一版数据。';els.error.style.display='block'}finally{if(manual){els.refresh.disabled=false;els.refresh.textContent='刷新看板'}}}
  els.q.addEventListener('input',render);els.topic.addEventListener('change',render);els.impact.addEventListener('change',render);els.refresh.addEventListener('click',function(){load(true)});load(false);setInterval(function(){load(false)},60000);
  if('serviceWorker' in navigator)window.addEventListener('load',function(){navigator.serviceWorker.register('./sw.js').catch(function(){})});
})();
</script>
</body>
</html>
