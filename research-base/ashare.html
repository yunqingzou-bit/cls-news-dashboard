<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ashare 行情研究</title><style>body{font-family:system-ui,'Microsoft YaHei';background:#f6f8fb;margin:24px;color:#1f2937}main{max-width:900px;margin:auto;background:white;padding:24px;border-radius:14px}table{width:100%;border-collapse:collapse}td,th{padding:9px;border-bottom:1px solid #e5e7eb;text-align:left}th{background:#f8fafc}.up{color:#dc2626}.down{color:#15803d}.muted{color:#64748b}</style><main><h1>Ashare 行情研究</h1><p class="muted">由 GitHub Actions 定时采集上证指数最近日线数据。</p><div id="app">正在加载…</div><script>fetch('../research-base.json?ts='+Date.now(),{cache:'no-store'}).then(r=>r.json()).then(d=>{var a=d.ashare||[],h='<p>更新时间：'+(d.generated_at||'—')+'</p><table><tr><th>日期</th><th>开盘</th><th>收盘</th><th>最高</th><th>最低</th></tr>';a.forEach(x=>{var date=x.date||x.index||'—',close=x.close||x.Close||'—';h+='<tr><td>'+date+'</td><td>'+ (x.open||'—')+'</td><td class="'+(Number(close)>0?'up':'')+'">'+close+'</td><td>'+ (x.high||'—')+'</td><td>'+ (x.low||'—')+'</td></tr>'});document.getElementById('app').innerHTML=h+'</table>'}).catch(e=>document.getElementById('app').textContent='数据加载失败：'+e.message)</script></main>
