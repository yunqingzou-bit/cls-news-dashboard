<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ashare 行情研究</title><style>body{font-family:system-ui,'Microsoft YaHei';background:#f6f8fb;margin:24px;color:#1f2937}main{max-width:1050px;margin:auto;background:white;padding:24px;border-radius:14px}table{width:100%;border-collapse:collapse}td,th{padding:10px;border-bottom:1px solid #e5e7eb;text-align:left}th{background:#f8fafc}.up{color:#dc2626}.down{color:#15803d}.muted{color:#64748b}.notice{padding:10px 12px;background:#eff6ff;border:1px solid #bfdbfe;border-radius:8px;color:#1e40af;margin:12px 0}.error{padding:10px 12px;background:#fff7ed;border:1px solid #fed7aa;border-radius:8px;color:#9a3412;margin:12px 0}.empty{text-align:center;padding:28px;color:#64748b}</style><main><h1>Ashare 行情研究</h1><p class="muted">上证指数行情：优先显示最近日线；历史接口异常时显示本轮实时快照，并明确标注数据来源。</p><div id="app">正在加载…</div><script>function esc(v){return String(v==null?'—':v).replace(/[&<>"']/g,function(c){return({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]})}fetch('../research-base.json?ts='+Date.now(),{cache:'no-store'}).then(function(r){if(!r.ok)throw Error('HTTP '+r.status);return r.json()}).then(function(d){var a=Array.isArray(d.ashare)?d.ashare:[],h='<p>更新时间：<b>'+esc(d.generated_at)+'</b>　记录数：<b>'+a.length+'</b></p>';if((d.errors||[]).some(function(x){return x.indexOf('ashare:')===0}))h+='<div class="notice">历史日线接口本轮不可用，已展示可用的指数快照兜底数据；该行不代表完整历史序列。</div>';if(!a.length){document.getElementById('app').innerHTML=h+'<div class="empty">当前没有可用的行情记录，请等待下一轮采集。</div>';return}h+='<table><tr><th>日期</th><th>开盘</th><th>收盘</th><th>最高</th><th>最低</th><th>涨跌幅</th><th>来源</th></tr>';a.forEach(function(x){var close=x.close??x.Close, pct=x.pct??x.change_pct??x.changePercent;h+='<tr><td>'+esc(x.date||x.index||x.datetime)+'</td><td>'+esc(x.open??x.Open)+'</td><td>'+esc(close)+'</td><td>'+esc(x.high??x.High)+'</td><td>'+esc(x.low??x.Low)+'</td><td class="'+(Number(pct)>0?'up':Number(pct)<0?'down':'')+'">'+esc(pct==null?'—':pct+'%')+'</td><td>'+esc(x.source||'Ashare 日线')+'</td></tr>'});document.getElementById('app').innerHTML=h+'</table>'}).catch(function(e){document.getElementById('app').innerHTML='<div class="error">数据加载失败：'+esc(e.message)+'</div>'})</script></main>
