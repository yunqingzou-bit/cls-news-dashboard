<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HiThink 金融数据</title><style>body{font-family:system-ui,'Microsoft YaHei';background:#f6f8fb;margin:24px;color:#1f2937}main{max-width:760px;margin:auto;background:white;padding:24px;border-radius:14px}.warn{background:#fffbeb;border:1px solid #fde68a;padding:14px;border-radius:10px;line-height:1.8}a{color:#075985}</style><main><h1>HiThink 金融数据</h1><div id="app">读取配置状态…</div><script>fetch('../research-base.json?ts='+Date.now(),{cache:'no-store'}).then(r=>r.json()).then(d=>{var h=d.hithink||{};document.getElementById('app').innerHTML='<div class="warn"><b>状态：</b>'+ (h.configured?'已配置，等待接口数据':'尚未配置 API 授权')+'<br><br>HiThink 数据需要在 GitHub Actions Secrets 中配置 HITHINK_API_URL 和对应鉴权参数。当前页面不会伪造授权数据。<br><br><a href="https://github.com/HiThink-Tech/Financial-API" target="_blank">查看接口配置说明</a></div>'})</script></main>
