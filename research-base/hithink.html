<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HiThink 金融数据</title><style>body{font-family:system-ui,'Microsoft YaHei';background:#f6f8fb;margin:24px;color:#1f2937}main{max-width:760px;margin:auto;background:white;padding:24px;border-radius:14px}.box{background:#f0f9ff;border:1px solid #bae6fd;padding:14px;border-radius:10px;line-height:1.8}.warn{background:#fffbeb;border-color:#fde68a}pre{white-space:pre-wrap;background:#f8fafc;padding:12px;border-radius:8px;overflow:auto}</style><main><h1>HiThink 金融数据</h1><div id="app">读取配置状态…</div><script>fetch('../research-base.json?ts='+Date.now(),{cache:'no-store'}).then(r=>r.json()).then(d=>{var x=d.hithink||{},s=x.sample?'<pre>'+JSON.stringify(x.sample,null,2).replace(/</g,'&lt;')+'</pre>':'';document.getElementById('app').innerHTML='<div class="box '+(x.configured?'':'warn')+'"><b>状态：</b>'+ (x.configured?(x.message||'已配置'):'尚未配置 API 授权')+'<br><br>页面只展示 Actions 生成的公开行情摘要，不会暴露 API Key。'+(x.configured?'':'<br>请在 GitHub Actions Secret 中配置 HITHINK_FINANCE_API_KEY。')+'<br><br><a href="https://github.com/HiThink-Tech/Financial-API" target="_blank">查看接口说明</a></div>'+s})</script></main>
