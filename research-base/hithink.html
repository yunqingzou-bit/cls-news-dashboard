<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HiThink 金融数据</title><style>body{font-family:system-ui,'Microsoft YaHei';background:#f6f8fb;margin:24px;color:#1f2937}main{max-width:1050px;margin:auto}.card{background:#fff;padding:24px;border-radius:14px;border:1px solid #e2e8f0}.status{background:#f0f9ff;border:1px solid #bae6fd;padding:12px;border-radius:10px;margin-bottom:16px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin:16px 0}.stat{background:#f8fafc;padding:14px;border-radius:10px}.stat b{display:block;font-size:20px;margin-top:4px}.muted{color:#64748b;font-size:13px}.up{color:#dc2626}.down{color:#15803d}.error{color:#b91c1c;background:#fef2f2;border:1px solid #fecaca;padding:12px;border-radius:8px}a{color:#075985}table{width:100%;border-collapse:collapse;margin-top:16px}td,th{padding:9px;border-bottom:1px solid #e5e7eb;text-align:left}th{background:#f8fafc}</style><main><div class="card"><h1>HiThink 金融数据</h1><div id="app">读取数据…</div></div></main><script>fetch('../research-base.json?ts='+Date.now(),{cache:'no-store'}).then(r=>r.json()).then(d=>{var x=d.hithink||{},p=x.sample||{},data=p.data||p.result||p,items=data.item||data.items||data.list||[];if(!Array.isArray(items))items=[];var h='<div class="status"><b>状态：</b>'+(x.message||'未配置')+'<br><span class="muted">数据通过 GitHub Actions 生成，API Key 不会发布到页面。</span></div>';if(!x.configured){h+='<div class="error">尚未配置 HITHINK_FINANCE_API_KEY。</div>'}else if(x.message==='API 调用失败'){h+='<div class="error">API 调用失败，请检查 Key 权限和接口额度。</div>'}else if(items.length){var q=items[0],chg=Number(q.price_change_ratio_pct||q.change_pct||0);h+='<p class="muted">标的：'+(q.thscode||q.ticker||'—')+'　更新时间：'+(q.timestamp||d.generated_at||'—')+'</p><div class="grid"><div class="stat">最新价<b>'+ (q.last_price??'—')+'</b></div><div class="stat">涨跌额<b class="'+(chg>=0?'up':'down')+'">'+(q.price_change??'—')+'</b></div><div class="stat">涨跌幅<b class="'+(chg>=0?'up':'down')+'">'+(q.price_change_ratio_pct??chg)+'%</b></div><div class="stat">成交量<b>'+ (q.volume??'—')+'</b></div><div class="stat">开盘<b>'+ (q.open_price??'—')+'</b></div><div class="stat">最高<b>'+ (q.high_price??'—')+'</b></div><div class="stat">最低<b>'+ (q.low_price??'—')+'</b></div><div class="stat">昨收<b>'+ (q.prev_price??'—')+'</b></div></div><table><tr><th>标的</th><th>最新价</th><th>涨跌幅</th><th>成交量</th></tr>'+items.map(function(v){var c=Number(v.price_change_ratio_pct||0);return '<tr><td>'+ (v.thscode||v.ticker||'—')+'</td><td>'+ (v.last_price??'—')+'</td><td class="'+(c>=0?'up':'down')+'">'+(v.price_change_ratio_pct??'—')+'%</td><td>'+ (v.volume??'—')+'</td></tr>'}).join('')+'</table>'}else{h+='<p class="muted">API 调用成功，但本轮没有返回行情条目。</p>'}h+='<p><a href="https://github.com/HiThink-Tech/Financial-API" target="_blank">查看接口说明</a></p>';document.getElementById('app').innerHTML=h}).catch(e=>document.getElementById('app').innerHTML='<div class="error">数据加载失败：'+e.message+'</div>')</script>
