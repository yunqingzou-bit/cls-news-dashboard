<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>levistock 数据研究 · 财联社看板</title><style>:root{font:14px/1.6 system-ui,"Microsoft YaHei",sans-serif;color:#1f2937;background:#f6f8fb}*{box-sizing:border-box}body{margin:0;padding:18px}main{max-width:1220px;margin:auto}.head{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}.muted{color:#64748b}.meta,.card{background:#fff;border:1px solid #e2e8f0;border-radius:14px;padding:16px}.meta{margin:14px 0}.error{color:#991b1b;background:#fff1f2;border:1px solid #fecdd3;padding:9px;border-radius:8px;margin-top:8px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.wide{grid-column:1/-1}.card h2{margin:0 0 12px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.stat{background:#f8fafc;padding:9px;border-radius:8px;text-align:center}.stat b{display:block;font-size:19px}.row{border-top:1px solid #eef2f7;padding:10px 0}.row:first-child{border-top:0}.line{display:flex;gap:8px;align-items:baseline}.rank{color:#64748b;width:23px}.name{font-weight:700;flex:1;overflow-wrap:anywhere}.pct{white-space:nowrap}.up{color:#dc2626}.down{color:#15803d}.detail{display:none;margin:7px 0 0 31px;padding:8px 10px;background:#f8fafc;border-radius:8px;color:#475569}.row.open .detail{display:block}.detail a{margin-right:9px}.empty{text-align:center;color:#64748b;padding:20px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.toolbar input,.toolbar button{font:inherit;padding:8px 10px;border:1px solid #cbd5e1;border-radius:8px}.toolbar input{flex:1;min-width:220px}.toolbar button{cursor:pointer;background:#075985;color:#fff;border-color:#075985}a{color:#075985}@media(max-width:700px){body{padding:10px}.grid{grid-template-columns:1fr}.wide{grid-column:auto}.stats{grid-template-columns:1fr 1fr}.card{padding:13px}.toolbar input{flex-basis:100%}}
</style></head><body><main><div class="head"><div><h1>levistock 数据研究</h1><p class="muted">市场情绪、风口板块、行业行情、主线机会、涨停池与财联社电报快讯</p></div><a href="../">返回新闻看板</a></div><div id="meta" class="meta">正在加载…</div><div class="toolbar"><input id="q" placeholder="搜索板块、股票或电报关键词"><button id="reload">刷新数据</button></div><div id="app" class="grid"></div></main><script>
(async function(){const $=id=>document.getElementById(id),esc=v=>String(v??'—').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),pick=(o,ks,d)=>{for(const k of ks)if(o&&o[k]!==undefined&&o[k]!==null&&String(o[k]).trim())return o[k];return d},arr=v=>Array.isArray(v)?v:(v&&typeof v==='object'?Object.values(v):[]),pct=v=>{if(v==null||v==='')return '';const n=Number(v);return Number.isFinite(n)?(Math.abs(n)<=1?n*100:n).toFixed(2)+'%':v},text=x=>String(pick(x,['title','headline','name','plate_name','secu_name','stock_name','content','text','mainLine_desc','chance_desc'],'—')),stocks=x=>{let v=pick(x,['stocks','stock_list','stockList','related_stocks','relatedStocks','constituents','members'],[]);if(!Array.isArray(v))v=[v];return v.flatMap(s=>{if(typeof s==='object'&&s)return [pick(s,['name','stock_name','secu_name','code','stock_code'],JSON.stringify(s))];return String(s).split(/[、,，\s]+/)}).filter(Boolean)},url=x=>pick(x,['url','link','article_url','articleUrl'],''),quote=c=>{const s=String(c||'');return /^(sh|sz)\d{6}$/i.test(s)?'https://gu.qq.com/'+s.toLowerCase()+'/gupiao':`https://www.baidu.com/s?wd=${encodeURIComponent(s)}`};function list(value,limit){let q=$('q').value.trim().toLowerCase(),a=arr(value).filter(x=>{const z=(JSON.stringify(x)+' '+text(x)).toLowerCase();return !q||z.includes(q)}).slice(0,limit);return a.length?a.map((x,i)=>{let ss=stocks(x),u=url(x),p=pick(x,['change_pct','changePercent','pct','change'],null),links=ss.map(s=>{let m=String(s).match(/(sh|sz)?(\d{6})/i),code=m?(m[1]||'sh').toLowerCase()+m[2]:s;return `<a href="${quote(code)}" target="_blank" rel="noopener">${esc(s)}</a>`}).join('、');return `<div class="row"><div class="line"><span class="rank">${i+1}</span><span class="name">${u?`<a href="${esc(u)}" target="_blank" rel="noopener">${esc(text(x))}</a>`:esc(text(x))}</span><span class="pct ${Number(p)>0?'up':Number(p)<0?'down':''}">${esc(pct(p))}</span></div><div class="detail">${links?`关联标的：${links}`:'暂无明确标的股票'}${ss.length||u?'　':''}${u?`<a href="${esc(u)}" target="_blank" rel="noopener">打开电报原文</a>`:''}</div></div>`}).join(''):'<div class="empty">暂无匹配数据；请检查接口状态或等待下一轮采集。</div>'}function bind(){document.querySelectorAll('.row').forEach(x=>x.onclick=e=>{if(e.target.tagName==='A')return;x.classList.toggle('open')})}async function load(){try{let r=await fetch('../research-base.json?ts='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);let d=await r.json(),m=d.market_emotion||{},u=pick(m,['up_down_dis','upDownDis'],{});$('meta').innerHTML=`数据更新时间：<b>${esc(d.generated_at||'—')}</b>　交易日：${esc(d.trade_date||'—')}　<a href="telegraph-analyzer.html">打开电报分析页</a>`+(d.errors?.length?`<div class="error">部分接口未返回：${esc(d.errors.join('；'))}</div>`:'');let h=`<section class="card wide"><h2>市场情绪</h2><div class="stats"><div class="stat"><b>${esc(pick(m,['market_degree','marketDegree'],'—'))}</b><span>市场热度</span></div><div class="stat"><b>${esc(pick(u,['up_num','upNum'],'—'))}</b><span>上涨家数</span></div><div class="stat"><b>${esc(pick(u,['down_num','downNum'],'—'))}</b><span>下跌家数</span></div><div class="stat"><b>${esc(pct(pick(m,['up_ratio','upRatio'],null)))}</b><span>封板率/比例</span></div></div></section>`;h+=`<section class="card"><h2>今日风口板块</h2>${list(d.market_wind,30)}</section><section class="card"><h2>行业实时行情</h2>${list(d.sector_industry,30)}</section><section class="card"><h2>涨停池</h2>${list(d.limit_up,30)}</section><section class="card"><h2>主线机会</h2>${list(d.mainline,30)}</section><section class="card wide"><h2>财联社电报快讯</h2>${list(d.telegraph,50)}</section>`;$('app').innerHTML=h;bind()}catch(e){$('meta').innerHTML=`<div class="error">数据加载失败：${esc(e.message)}</div>`;$('app').innerHTML='<section class="card wide"><div class="empty">请等待下一轮 GitHub Actions 采集。</div></section>'}}$('q').oninput=load;$('reload').onclick=load;load()})();
</script></body></html>
