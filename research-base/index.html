<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>levistock 数据研究 · 财联社看板</title><style>body{font-family:system-ui,'Microsoft YaHei',sans-serif;background:#f6f8fb;color:#1f2937;margin:0;padding:24px}main{max-width:1180px;margin:auto}h1{margin:0 0 6px}.sub{color:#64748b;margin:0 0 18px}.meta{font-size:13px;color:#64748b;background:#fff;border:1px solid #e2e8f0;border-radius:10px;padding:10px 14px;margin-bottom:16px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}.card{background:#fff;border:1px solid #e2e8f0;border-radius:14px;padding:18px;box-shadow:0 4px 16px #0f172a0b;min-width:0}.card.wide{grid-column:1/-1}.card h2{font-size:17px;margin:0 0 12px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.stat{background:#f8fafc;border-radius:8px;padding:9px;text-align:center}.stat b{display:block;font-size:18px}.stat span{font-size:11px;color:#64748b}.row{display:flex;gap:10px;align-items:baseline;padding:8px 0;border-bottom:1px solid #eef2f7}.row:last-child{border:0}.rank{color:#64748b;width:22px}.name{font-weight:650;flex:1}.muted{color:#64748b;font-size:12px}.up{color:#dc2626}.down{color:#15803d}.empty{color:#94a3b8;padding:10px 0}.chips{display:flex;flex-wrap:wrap;gap:7px}.chip{background:#eff6ff;color:#075985;border-radius:999px;padding:6px 9px;font-size:13px}.error{color:#b91c1c;background:#fef2f2;border:1px solid #fecaca;padding:10px;border-radius:8px;font-size:13px}a{color:#075985}</style></head><body><main><h1>levistock 数据研究</h1><p class="sub">财联社市场情绪、风口板块、主线机会、涨停池与电报快讯</p><div id="meta" class="meta">正在加载最新数据…</div><div id="app" class="grid"></div></main><script>(async function(){var app=document.getElementById('app'),meta=document.getElementById('meta');function h(v){return String(v==null?'':v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;')}function pick(o,k,d){for(var i=0;i<k.length;i++)if(o&&o[k[i]]!=null)return o[k[i]];return d}function arr(v){return Array.isArray(v)?v:(v&&typeof v==='object'?Object.values(v):[])}function rows(list,limit){var a=arr(list).slice(0,limit||10);return a.length?a.map(function(x,i){var n=pick(x,['name','plate_name','secu_name','stock_name','title','content'],'—'),p=pick(x,['change_pct','change','changePercent','pct'],null),c=Number(p)>0?'up':Number(p)<0?'down':'';return '<div class="row"><span class="rank">'+(i+1)+'</span><span class="name">'+h(n)+'</span><span class="muted '+c+'">'+(p==null?'':h(p)+'%')+'</span></div>'}).join(''):'<div class="empty">暂无数据</div>'}try{var r=await fetch('../research-base.json?ts='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);var d=await r.json();meta.innerHTML='数据更新时间：<b>'+h(d.generated_at||'未知')+'</b>　来源：levistock　交易日：'+h(d.trade_date||'未知')+'　<a href="../">返回新闻看板</a>';if((d.errors||[]).length)meta.innerHTML+='<div class="error">部分接口暂不可用：'+h(d.errors.join('、'))+'</div>';var m=d.market_emotion||{},u=pick(m,['up_down_dis','upDownDis'],{}),html='<section class="card wide"><h2>市场情绪</h2><div class="stats"><div class="stat"><b>'+h(pick(m,['market_degree','marketDegree'],'—'))+'</b><span>市场热度</span></div><div class="stat"><b>'+h(pick(u,['up_num','upNum'],'—'))+'</b><span>上涨家数</span></div><div class="stat"><b>'+h(pick(u,['down_num','downNum'],'—'))+'</b><span>下跌家数</span></div><div class="stat"><b>'+h(pick(m,['up_ratio','upRatio'],'—'))+'</b><span>封板率</span></div></div></section>';html+='<section class="card"><h2>今日风口板块</h2>'+rows(d.market_wind,10)+'</section><section class="card"><h2>行业实时行情</h2>'+rows(d.sector_industry,10)+'</section><section class="card"><h2>涨停池</h2>'+rows(d.limit_up,15)+'</section><section class="card"><h2>主线机会</h2>'+rows(d.mainline,10)+'</section><section class="card wide"><h2>财联社电报快讯</h2>'+rows(d.telegraph,20)+'</section>';app.innerHTML=html}catch(e){meta.textContent='数据加载失败：'+e.message;app.innerHTML='<div class="card wide"><div class="error">当前还没有成功发布 levistock 数据，请等待下一轮 GitHub Actions 采集。</div></div>'}})();</script></body></html>
