<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>财联社电报分析</title>
<style>
:root{font:14px/1.6 system-ui,"Microsoft YaHei",sans-serif;color:#1f2937;background:#f6f8fb}*{box-sizing:border-box}body{margin:0;padding:18px}main{max-width:1180px;margin:auto}a{color:#075985}.head{display:flex;justify-content:space-between;gap:12px;align-items:start;flex-wrap:wrap}.muted{color:#64748b}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.toolbar input,.toolbar select,.toolbar button{font:inherit;padding:8px 10px;border:1px solid #cbd5e1;border-radius:8px;background:#fff}.toolbar input{flex:1;min-width:220px}.toolbar button{cursor:pointer;color:#fff;background:#075985;border-color:#075985}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.card{background:#fff;padding:18px;border-radius:14px;border:1px solid #e2e8f0;min-width:0}.wide{grid-column:1/-1}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{background:#f8fafc;border-radius:9px;padding:11px}.stat b{display:block;font-size:24px}.bar{display:flex;align-items:center;gap:9px;margin:9px 0}.bar span:first-child{width:100px;flex:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.bar i{height:12px;min-width:6px;background:#38bdf8;border-radius:6px;display:block}.chip{display:inline-block;background:#eff6ff;color:#075985;border-radius:999px;padding:5px 9px;margin:4px}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:650px}th,td{padding:9px;border-bottom:1px solid #e5e7eb;text-align:left;vertical-align:top}th{background:#f8fafc;white-space:nowrap}.empty{text-align:center;color:#64748b;padding:24px}.error{color:#b91c1c;background:#fff1f2;border:1px solid #fecdd3;border-radius:8px;padding:10px}@media(max-width:700px){body{padding:10px}.grid{grid-template-columns:1fr}.wide{grid-column:auto}.card{padding:14px}.stats{grid-template-columns:1fr 1fr}.stats .stat:last-child{grid-column:1/-1}.head h1{font-size:24px}.toolbar input{flex-basis:100%}}
</style>
</head>
<body><main>
<div class="head"><div><a href="../ai-investment/">← 返回 AI 投研助手</a><h1>资讯分析报告 · cls-telegraph-analyzer</h1><p class="muted">按小时聚合财联社电报，分析主题热度、情绪分布和研究线索。</p></div><a href="../">返回新闻看板</a></div>
<div class="toolbar"><input id="search" placeholder="搜索主题、股票或关键词"><select id="sort"><option value="count">按消息数排序</option><option value="name">按名称排序</option></select><button id="reload">刷新报告</button></div>
<div id="app"><div class="empty">加载中…</div></div>
</main>
<script>
(async function(){
const $=id=>document.getElementById(id), esc=v=>String(v??'—').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const state={analysis:null,news:[]};
function render(){const d=state.analysis||{},q=$('search').value.trim().toLowerCase(),sort=$('sort').value,sent=d.sentiment||{},total=Object.values(sent).reduce((a,b)=>a+Number(b||0),0);let h='<div class="grid">';
h+=`<section class="card wide"><h2>总体概览</h2><div class="stats"><div class="stat"><span>去重后消息</span><b>${esc(d.total||0)}</b></div><div class="stat"><span>影响级别</span><b>${esc(d.impact_level||'—')}</b></div><div class="stat"><span>主导情绪</span><b>${esc((Object.entries(sent).sort((a,b)=>b[1]-a[1])[0]||['—'])[0])}</b></div></div><p class="muted">更新时间：${esc(d.generated_at||'—')}　交易日：${esc(d.trade_date||'—')}</p></section>`;
h+='<section class="card"><h2>情绪分布</h2>'+Object.entries(sent).map(x=>`<div class="bar"><span>${esc(x[0])}</span><i style="width:${Math.max(8,total?x[1]/total*220:8)}px"></i><b>${esc(x[1])}</b></div>`).join('')+'</section>';
let sectors=Object.entries(d.sectors||{}).filter(x=>!q||x[0].toLowerCase().includes(q)).sort((a,b)=>sort==='name'?a[0].localeCompare(b[0]):b[1]-a[1]).slice(0,20),max=Math.max(...sectors.map(x=>x[1]),1);h+='<section class="card"><h2>主题/板块热度</h2>'+(sectors.length?sectors.map(x=>`<div class="bar"><span>${esc(x[0])}</span><i style="width:${Math.max(8,x[1]/max*220)}px"></i><b>${esc(x[1])}</b></div>`).join(''):'<div class="empty">没有匹配主题</div>')+'</section>';
h+='<section class="card"><h2>高频股票</h2>'+((d.top_stocks||[]).filter(x=>!q||JSON.stringify(x).toLowerCase().includes(q)).slice(0,20).map(x=>`<span class="chip">${esc(x.code)} · ${esc(x.mentions)} 次</span>`).join('')||'<div class="empty">暂无股票代码</div>')+'</section>';
const hourly=(d.hourly||[]).slice().sort((a,b)=>String(a.hour).localeCompare(String(b.hour))),hm=Math.max(...hourly.map(x=>x.count),1);h+='<section class="card"><h2>每小时消息量</h2>'+(hourly.length?hourly.map(x=>`<div class="bar"><span>${esc(x.hour)}</span><i style="width:${Math.max(8,x.count/hm*330)}px"></i><b>${esc(x.count)}</b></div>`).join(''):'<div class="empty">暂无小时数据</div>')+'</section>';
const ns=state.news.filter(x=>!q||JSON.stringify(x).toLowerCase().includes(q)).slice(0,30);h+=`<section class="card wide"><h2>代表性电报 <span class="muted">${ns.length} 条</span></h2><div class="table-wrap"><table><thead><tr><th>时间</th><th>主题/来源</th><th>内容</th></tr></thead><tbody>${ns.length?ns.map(x=>`<tr><td>${esc(x.time||x.publish_time||x.date)}</td><td>${esc(x.prefix||x.category||x.source||'电报')}</td><td>${esc(x.title||x.content||x.text)}</td></tr>`).join(''):'<tr><td colspan="3" class="empty">暂无可展示的代表性电报</td></tr>'}</tbody></table></div></section></div>`;$('app').innerHTML=h}
async function load(){try{const a=await fetch('../telegraph-analysis.json?ts='+Date.now(),{cache:'no-store'});if(!a.ok)throw Error('分析数据 HTTP '+a.status);state.analysis=await a.json();try{const n=await fetch('../research-base.json?ts='+Date.now(),{cache:'no-store'});const nd=await n.json();state.news=Array.isArray(nd.telegraph)?nd.telegraph:[]}catch(_){state.news=[]}render()}catch(e){$('app').innerHTML=`<div class="error">分析数据暂未发布：${esc(e.message)}</div>`}}
$('search').oninput=render;$('sort').onchange=render;$('reload').onclick=load;load()})();
</script></body></html>
