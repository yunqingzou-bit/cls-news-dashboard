<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>财联社电报分析</title><style>body{font-family:system-ui,'Microsoft YaHei';background:#f6f8fb;margin:24px;color:#1f2937}main{max-width:1100px;margin:auto}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}.card{background:#fff;padding:18px;border-radius:14px;border:1px solid #e2e8f0}.wide{grid-column:1/-1}.bar{display:flex;align-items:center;gap:10px;margin:8px 0}.bar i{height:12px;background:#38bdf8;border-radius:6px;display:block}.chip{display:inline-block;background:#eff6ff;color:#075985;border-radius:999px;padding:6px 10px;margin:4px}.muted{color:#64748b;font-size:13px}.error{color:#b91c1c}</style><main><h1>财联社电报分析</h1><p class="muted">按小时聚合、板块分类、情绪判断与影响级别评估。</p><div id="app">加载中…</div><script>fetch('../telegraph-analysis.json?ts='+Date.now(),{cache:'no-store'}).then(r=>r.json()).then(d=>{var max=Math.max.apply(null,(d.hourly||[]).map(x=>x.count).concat([1])),h='<div class="grid"><section class="card"><h2>总体概览</h2><p>消息总数：<b>'+d.total+'</b></p><p>影响级别：<b>'+d.impact_level+'</b></p><p class="muted">更新时间：'+(d.generated_at||'—')+'</p></section><section class="card"><h2>情绪分布</h2>'+Object.entries(d.sentiment||{}).map(x=>'<p>'+x[0]+'：'+x[1]+'</p>').join('')+'</section><section class="card"><h2>板块分布</h2>'+Object.entries(d.sectors||{}).map(x=>'<div class="bar"><span>'+x[0]+' '+x[1]+'</span><i style="width:'+Math.max(8,x[1]/max*180)+'px"></i></div>').join('')+'</section><section class="card"><h2>高频股票</h2>'+((d.top_stocks||[]).map(x=>'<span class="chip">'+x.code+' · '+x.mentions+'次</span>').join('')||'暂无股票代码')+'</section><section class="card wide"><h2>每小时消息量</h2>'+((d.hourly||[]).map(x=>'<div class="bar"><span style="width:150px">'+x.hour+'</span><i style="width:'+Math.max(8,x.count/max*600)+'px"></i><b>'+x.count+'</b></div>').join('')||'暂无数据')+'</section></div>';document.getElementById('app').innerHTML=h}).catch(e=>document.getElementById('app').innerHTML='<p class="error">分析数据暂未发布：'+e.message+'</p>')</script></main>
